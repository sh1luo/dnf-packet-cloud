name: dnf-packet-cloud-dev
services:
  mysql:
    image: mysql:8.4.7
    ports:
      - "127.0.0.1:33067:3306"
    environment:
      MYSQL_DATABASE: packet_cloud_test
      MYSQL_USER: packet_test
      MYSQL_PASSWORD: packet_test
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - packet-mysql:/var/lib/mysql

volumes:
  packet-mysql:
